<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#163c58">
  <title>التسجيل في ورشة منصة العمل التطوعي | إمارة منطقة تبوك</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:#163047;background:#eef3f5}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}header{background:#123d58;color:white;padding:26px max(20px,calc((100vw - 900px)/2));border-bottom:5px solid #bba06a}header .eyebrow{font-size:14px;color:#dce9ed}h1{font-size:clamp(24px,4vw,36px);line-height:1.35;margin:8px 0 5px}header p{margin:0;color:#e3edef}main{max-width:900px;margin:24px auto 60px;padding:0 16px}.shell{background:#fff;border:1px solid #d8e3e9;border-radius:22px;padding:clamp(20px,4vw,36px);box-shadow:0 12px 35px #193e5312}.topline{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:9px}.topline strong{font-size:16px}.topline span{font-size:14px;color:#547185}.track{height:7px;border-radius:30px;background:#dce7eb;overflow:hidden}.fill{height:100%;width:25%;background:#bd9c61;transition:width .25s}.step{display:none}.step.active{display:block}.step h2{font-size:23px;margin:28px 0 6px}.hint{color:#526d7c;margin:0 0 22px;line-height:1.6}.field{border:0;margin:0 0 24px;padding:0}.field legend{font-size:16px;font-weight:650;line-height:1.5;margin-bottom:10px}.req{color:#a14632}.textinput{width:100%;border:1px solid #bacbd4;border-radius:12px;padding:13px 15px;background:#fff;color:#163047;min-height:50px}.textinput:focus,.choice:focus-within{outline:3px solid #a8c9d5;outline-offset:2px}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px}.choice{border:1px solid #cbd9df;border-radius:12px;min-height:48px;padding:11px 12px;display:flex;align-items:center;gap:9px;cursor:pointer;line-height:1.45}.choice:has(input:checked){border-color:#146187;background:#eaf4f8}.choice input{accent-color:#146187;width:18px;height:18px;flex:none}.scale{display:flex;gap:7px;flex-wrap:wrap}.scale .choice{min-width:54px;justify-content:center;padding:8px}.scale .choice input{position:absolute;opacity:0;width:1px;height:1px}.bounds{display:flex;justify-content:space-between;max-width:360px;color:#536e7d;font-size:14px;margin-top:6px}.actions{display:flex;justify-content:space-between;gap:12px;border-top:1px solid #e3ecef;padding-top:22px;margin-top:10px}.btn{border:0;border-radius:11px;background:#135f81;color:white;padding:12px 24px;min-height:48px;font-weight:650}.btn:disabled{opacity:.6;cursor:wait}.secondary{background:#e8eff2;color:#21455a}.error{color:#9e342e;background:#fff0ee;border-radius:10px;padding:10px 14px;margin:14px 0;display:none}.success{text-align:center;padding:35px 8px}.success .icon{font-size:42px;color:#248270}.success h2{font-size:27px}.success p{line-height:1.7;color:#536e7d}.small{font-size:13px;color:#5d7480;margin-top:17px}a{color:#135f81}@media(max-width:560px){.choices{grid-template-columns:1fr}.scale{justify-content:space-between}.scale .choice{flex:1;min-width:0}.actions .btn{flex:1}}
  </style>
</head>
<body>
<header><div class="eyebrow">إمارة منطقة تبوك · العمل التطوعي</div><h1>ورشة تحديثات منصة العمل التطوعي</h1><p>استبانة قياس المعرفة والاحتياجات قبل الورشة</p></header>
<main><div class="shell" id="formShell"><div class="topline"><strong id="stepName">البيانات الأساسية</strong><span id="counter">الخطوة ١ من ٤</span></div><div class="track" aria-hidden="true"><div class="fill" id="fill"></div></div><form id="registration" novalidate><div id="steps"></div><div class="error" id="error" role="alert"></div><div class="actions"><button type="button" class="btn secondary" id="back" hidden>السابق</button><button type="button" class="btn" id="next">التالي</button></div></form><p class="small">بعد الإرسال ستظهر صفحة تأكيد Google. تظهر الإجابات في جدول الردود إذا كان النموذج مرتبطًا به.</p></div><section class="shell success" id="success" hidden><div class="icon">✓</div><h2>شكرًا لك</h2><p>أُرسل ردك. يمكنك إغلاق هذه الصفحة الآن.</p></section></main>

<script>
const FORM_URL='https://docs.google.com/forms/d/e/1FAIpQLSccJ_8LHSqYAxwEJ1kLPGLSEuQslR0sCMdu6XAyEHBM_t_xaA/formResponse';
const FALLBACK_URL='https://docs.google.com/forms/d/e/1FAIpQLSccJ_8LHSqYAxwEJ1kLPGLSEuQslR0sCMdu6XAyEHBM_t_xaA/viewform';
const labels=['البيانات الأساسية','تجربتك مع المنصة','تقييم معرفتك','احتياجات الورشة'];
let fields=[],step=0,sending=false;
const form=document.querySelector('#registration'),steps=document.querySelector('#steps'),error=document.querySelector('#error');
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function group(i){return i<7?0:i<16?2:3} // أول سبعة أسئلة تشمل البيانات والتجربة؛ يُعاد توزيعها أدناه.
function section(i){return i<5?0:i<7?1:i<16?2:3}
function buildField(f,i){const box=el('fieldset','field');box.dataset.field=i;const legend=el('legend','',f.label);if(f.required)legend.append(el('span','req',' *'));box.append(legend);
  if(f.type===0){const input=el('input','textinput');input.type=i===1?'tel':i===2?'email':'text';input.autocomplete=i===0?'name':i===1?'tel':i===2?'email':'off';input.dir='auto';input.name='entry.'+f.entry;input.required=f.required;if(i===1){input.inputMode='tel';input.pattern='[0-9+\\s-]{8,18}'}box.append(input)}
  else{const list=el('div',f.type===5?'scale':'choices');f.options.forEach(o=>{const label=el('label','choice');const input=el('input');input.type='radio';input.name='entry.'+f.entry;input.value=o;input.required=f.required;label.append(input,el('span','',o));list.append(label)});box.append(list);
    if(f.type===5){const bounds=el('div','bounds');bounds.append(el('span','',f.bounds?.[0]||'لا أعرف'),el('span','',f.bounds?.[1]||'ممتاز'));box.append(bounds)}
    if(f.other){const other=el('input','textinput');other.type='text';other.placeholder='خيار آخر (اختياري)';other.setAttribute('aria-label','خيار آخر: '+f.label);other.style.marginTop='10px';other.addEventListener('input',()=>{if(other.value.trim())box.querySelectorAll('input[type=radio]').forEach(r=>r.checked=false)});box.append(other)}
  }return box}
function show(){document.querySelectorAll('.step').forEach((n,i)=>n.classList.toggle('active',i===step));document.querySelector('#stepName').textContent=labels[step];document.querySelector('#counter').textContent=`الخطوة ${step+1} من ٤`;document.querySelector('#fill').style.width=((step+1)*25)+'%';document.querySelector('#back').hidden=step===0;document.querySelector('#next').textContent=step===3?'إرسال الإجابات':'التالي';error.style.display='none';window.scrollTo({top:0,behavior:'smooth'})}
function validate(){const panel=document.querySelectorAll('.step')[step];for(const box of panel.querySelectorAll('.field')){const text=box.querySelector('input.textinput:not([placeholder])');const radios=[...box.querySelectorAll('input[type=radio]')];const other=box.querySelector('input[placeholder]');let valid=true;if(text){valid=!text.required||text.validity.valid}else if(fields[+box.dataset.field].required){valid=radios.some(r=>r.checked)||!!other?.value.trim()}if(!valid){error.textContent='يرجى إكمال الحقل المطلوب: '+fields[+box.dataset.field].label;error.style.display='block';(text||radios[0]||other).focus();return false}}return true}
function submit(){if(sending)return;sending=true;const btn=document.querySelector('#next');btn.disabled=true;btn.textContent='جارٍ إرسال الإجابات…';
  const payload=el('form');payload.method='POST';payload.action=FORM_URL;payload.target='_self';payload.style.display='none';
  const add=(k,v)=>{const n=el('input');n.name=k;n.value=v;payload.append(n)};
  fields.forEach((f,i)=>{const box=document.querySelector(`[data-field="${i}"]`);let v=box.querySelector('input.textinput:not([placeholder])')?.value.trim();const checked=box.querySelector('input[type=radio]:checked');if(checked)v=checked.value;const other=box.querySelector('input[placeholder]')?.value.trim();if(other){v='__other_option__';add('entry.'+f.entry+'.other_option_response',other)}if(v)add('entry.'+f.entry,v)});
  add('emailAddress',document.querySelector('[name="entry.245833343"]').value.trim());add('fvv','1');add('pageHistory','0');document.body.append(payload);payload.submit();
}
document.querySelector('#next').addEventListener('click',()=>{if(!validate())return;if(step<3){step++;show()}else submit()});document.querySelector('#back').addEventListener('click',()=>{step--;show()});
fetch('./fields.json').then(r=>r.json()).then(data=>{fields=data;labels.forEach((name,i)=>{const pane=el('section','step');pane.dataset.step=i;pane.append(el('h2','',name),el('p','hint',['أدخل بياناتك لنتمكن من التواصل بشأن الورشة.','أخبرنا عن تجربتك السابقة مع المنصة.','اختر درجة معرفتك من ١ إلى ٥ لكل عبارة.','ساعدنا في تحديد ما تحتاجه خلال الورشة.'][i]));data.forEach((f,j)=>{if(section(j)===i)pane.append(buildField(f,j))});steps.append(pane)});show()}).catch(()=>{error.textContent='تعذّر تحميل الأسئلة. حدّث الصفحة وحاول مجددًا.';error.style.display='block';document.querySelector('#next').disabled=true});
</script>
</body></html>
